name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated main tag and release contract
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git cat-file -t "$TAG")" == "tag" ]]
          tag_commit="$(git rev-list -n 1 "$TAG")"
          git fetch origin main
          git merge-base --is-ancestor "$tag_commit" origin/main
          node scripts/release-version.mjs check --tag "$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm security:check && pnpm release:check
      - run: node scripts/generate-third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: python3 -m pip install --disable-pip-version-check -r packages/obsidian-skills/requirements-optional.txt
      - run: python3 packages/obsidian-skills/refresh_manifest.py && git diff --exit-code -- packages/obsidian-skills/manifest.json
      - run: python3 packages/obsidian-skills/verify.py
      - run: python3 -m unittest discover -s packages/obsidian-skills/skills/obsidian-ingest/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s packages/obsidian-skills/skills/obsidian-health-check/scripts -p 'test_*.py'
      - run: python3 packages/obsidian-skills/skills/obsidian-health-check/scripts/audit_vault.py --vault starter-vault --fail-on warning
      - run: pnpm release:build
      - name: Verify release assets
        run: |
          set -euo pipefail
          cd .workbench-data/releases
          shasum -a 256 -c SHA256SUMS.txt
          test -s RELEASE_NOTES.md
      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_dir=".workbench-data/releases"
          assets=(
            "$release_dir/obsidian-codex-workbench-$TAG.zip"
            "$release_dir/obsidian-codex-starter-$TAG.zip"
            "$release_dir/SHA256SUMS.txt"
          )
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$release_dir/is-draft"; then
            [[ "$(cat "$release_dir/is-draft")" == "true" ]] || { echo "Refusing to overwrite published release $TAG" >&2; exit 1; }
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$release_dir/RELEASE_NOTES.md"
          else
            gh release create "$TAG" "${assets[@]}" --draft --verify-tag --title "$TAG" --notes-file "$release_dir/RELEASE_NOTES.md"
          fi
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' "obsidian-codex-starter-$TAG.zip" "obsidian-codex-workbench-$TAG.zip" "SHA256SUMS.txt" | sort)"
          [[ "$actual" == "$expected" ]] || { echo "Release assets differ from the required set" >&2; exit 1; }
          gh release edit "$TAG" --draft=false --latest
